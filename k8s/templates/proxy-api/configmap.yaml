apiVersion: v1
kind: ConfigMap
metadata:
  name: proxy-api-config
  labels:
    app: proxy-api
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft.AspNetCore": "Warning"
        }
      },
      "AllowedHosts": "*",
      "Urls": "http://0.0.0.0:8080"
    }
